events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$upstream_addr" $request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend cluster (2 FastAPI replicas)
    upstream backend_cluster {
        least_conn;
        server backend1:8000 max_fails=3 fail_timeout=5s;
        server backend2:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Global Proxy Settings - Overwrite client-supplied headers to prevent IP spoofing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Crucial security requirement: Overwrite X-Forwarded-For with the true peer remote address
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket endpoints
        location /ws/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health endpoints
        location /health {
            proxy_pass http://backend_cluster/health;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://backend_cluster;
        }

        # Fallback for root / docs
        location / {
            proxy_pass http://backend_cluster;
        }
    }
}
