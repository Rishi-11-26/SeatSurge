services:
  postgres:
    image: postgres:16-alpine
    container_name: seatsurge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatsurge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatsurge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-seatsurge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seatsurge} -d ${POSTGRES_DB:-seatsurge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seatsurge-net

  redis:
    image: redis:7-alpine
    container_name: seatsurge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - seatsurge-net

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seatsurge-backend-1
    restart: unless-stopped
    environment:
      INSTANCE_ID: backend-1
      APP_ENV: ${APP_ENV:-production}
      PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-seatsurge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatsurge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-seatsurge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-seatsurge-development-secret-key-32chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seatsurge-net

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seatsurge-backend-2
    restart: unless-stopped
    environment:
      INSTANCE_ID: backend-2
      APP_ENV: ${APP_ENV:-production}
      PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-seatsurge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatsurge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-seatsurge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-seatsurge-development-secret-key-32chars-min}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seatsurge-net

  nginx:
    image: nginx:alpine
    container_name: seatsurge-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - seatsurge-net

volumes:
  postgres_data:
    name: seatsurge_postgres_data
  redis_data:
    name: seatsurge_redis_data

networks:
  seatsurge-net:
    name: seatsurge-net
    driver: bridge
